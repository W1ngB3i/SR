name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    name: Typecheck / Test / Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        # 版本取自根 package.json 的 packageManager 字段

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: 安装依赖
        run: pnpm install --frozen-lockfile

      - name: 类型检查（先构建 shared 契约）
        run: pnpm typecheck

      - name: 单元测试
        run: pnpm test

      - name: 构建用户端
        run: pnpm --filter @sr/user-frontend build

      - name: 构建管理后台
        run: pnpm --filter @sr/admin-frontend build
